<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - Uplift Gym</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <header class="header">
    <div class="container header-inner">
      <a class="brand" href="index.html">
        <img src="images/uplift.png" alt="Uplift Gym logo" class="brand-logo" />
        <span class="brand-name">Uplift Gym</span>
      </a>

      <nav class="nav">
        <a href="index.html">Home</a>
        <a href="classes.html">Classes</a>
        <a href="about.html">About</a>
        <a href="pricing.html">Pricing</a>
      </nav>
    </div>
  </header>

  <main class="section">
    <div class="container">
      <div class="section-head" style="text-align:center;">
        <h2>Login</h2>
        <p>Sign in with your registered account.</p>
      </div>

      <div class="confirm-card" style="max-width: 560px;">
        <form id="loginForm">
          <div class="form-section">
            <label for="email"><strong>Email *</strong></label>
            <input type="email" id="email" name="email" placeholder="you@example.com" required />

            <label for="password"><strong>Password *</strong></label>
            <input type="password" id="password" name="password" placeholder="Enter your password" required />
          </div>

          <button type="submit" class="btn btn-primary" style="width: 100%;">Login</button>
        </form>

        <p id="loginMessage" class="confirm-note" style="margin-top: 14px;"></p>

        <div class="confirm-actions" style="margin-top: 18px;">
          <button type="button" class="btn btn-outline-dark" onclick="goBackPage()">Back</button>
          <a class="btn btn-dark" id="signupLink" href="/signup.html">Create Account</a>
        </div>
      </div>
    </div>
  </main>

  <footer class="footer">
    <div class="container">
      <p>© <span id="year"></span> Uplift Gym</p>
    </div>
  </footer>

  <script src="login.js"></script>
</body>
</html>
