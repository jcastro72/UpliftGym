<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Classes - Uplift Gym</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <header class="header">
    <div class="container header-inner">
      <a class="brand" href="index.html">
        <img src="images/uplift.png" alt="Uplift Gym logo" class="brand-logo" />
        <span class="brand-name">Uplift Gym</span>
      </a>

      <nav class="nav">
        <a href="index.html">Home</a>
        <a class="active" href="classes.html">Classes</a>
        <a href="about.html">About</a>
        <a href="pricing.html">Pricing</a>
        <a id="loginNavLink" href="/login.html">Login</a>
        <span id="userStatus" class="user-status" style="display:none;"></span>
        <button id="logoutBtn" onclick="logout()" class="btn btn-dark user-logout" style="display:none;">Logout</button>
      </nav>
    </div>
  </header>

  <main class="section">
    <div class="container">
      <div class="section-head">
        <h2>Available Classes</h2>
        <p>Each class has a limit of 20 people.</p>
      </div>

      <!-- Class grid container will be filled dynamically -->
      <div class="class-grid" id="classGrid"></div>
    </div>
  </main>

  <footer class="footer">
    <div class="container">
      <p>© <span id="year"></span> Uplift Gym</p>
    </div>
  </footer>

  <script>
    document.getElementById("year").textContent = new Date().getFullYear();
  </script>

  <script src="auth.js"></script>
  <script src="script.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", async function () {
      await renderAuthMenu();
    });
  </script>

  <script src="classesData.js"></script>
  <script src="classes.js"></script>



</body>
</html>
