<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Payment - Uplift Gym</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="auth.js"></script>
</head>
<body>

  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      await requireAuth();
    });
  </script>

  <header class="header">
    <div class="container header-inner">
      <a class="brand" href="index.html">
        <img src="images/uplift.png" class="brand-logo" alt="Uplift Gym logo" />
        <span class="brand-name">Uplift Gym</span>
      </a>

      <nav class="nav">
        <a href="index.html">Home</a>
        <a href="classes.html">Classes</a>
        <a href="about.html">About</a>
        <a href="pricing.html">Pricing</a>
        <a id="loginNavLink" href="login.html">Login</a>
        <span id="userStatus" style="display:none; font-weight:700; margin-left:8px;"></span>
        <button id="logoutBtn" onclick="logout()" class="btn btn-dark" style="display:none; margin-left:8px;">Logout</button>
      </nav>
    </div>
  </header>

  <main class="booking-container">
    <div class="booking-card">

      <h1 class="payment-title">Membership Payment</h1>
      <p class="payment-subtitle">Complete your purchase</p>

      <div class="payment-section">
        <h3 class="payment-heading">Selected Plan</h3>
        <p><strong>Plan:</strong> <span id="planName"></span></p>
        <p><strong>Price:</strong> <span id="planPrice"></span></p>
      </div>

      <div class="payment-section">
        <h3 class="payment-heading">Payment Information</h3>

        <label for="card">Card Number *</label>
        <input id="card" maxlength="19" placeholder="1234 5678 9012 3456" required />

        <label for="name">Cardholder Name *</label>
        <input id="name" placeholder="John Doe" required />

        <label for="expiry">Expiry Date *</label>
        <input id="expiry" maxlength="5" placeholder="MM/YY" required />

        <label for="cvv">CVV *</label>
        <input id="cvv" maxlength="4" placeholder="123" required />

        <div class="billing-checkbox-row">
          <label for="useProfileAddress" class="billing-checkbox-label">
            <input type="checkbox" id="useProfileAddress" />
            <span>Use my registration address</span>
          </label>
        </div>

        <label for="street">Street *</label>
        <input id="street" placeholder="123 Main St" required />

        <label for="city">City *</label>
        <input id="city" placeholder="Orlando" required />

        <label for="state">State *</label>
        <input id="state" maxlength="2" placeholder="FL" required />

        <label for="zip">ZIP Code *</label>
        <input id="zip" maxlength="5" placeholder="12345" required />

        <p class="payment-note">Demo payment only. No real charge.</p>
      </div>

      <div class="payment-actions">
        <button class="secondary-btn" type="button" onclick="window.location.href='pricing.html'">
          Back
        </button>

        <button id="payBtn" class="primary-btn" type="button">
          Complete Payment
        </button>
      </div>

    </div>
  </main>

  <footer class="footer">
    <div class="container">
      <p>© <span id="year"></span> Uplift Gym</p>
    </div>
  </footer>

  <script src="payment.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", async function () {
      await renderAuthMenu();
    });
  </script>
</body>
</html>
