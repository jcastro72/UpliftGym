<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Payment - Uplift Gym</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="auth.js"></script>
</head>
<body>

  <script>
    requireAuth();
  </script>

  <header class="header">
    <div class="container header-inner">
      <a class="brand" href="index.html">
        <img src="images/uplift.png" class="brand-logo" alt="Uplift Gym logo" />
        <span class="brand-name">Uplift Gym</span>
      </a>

      <nav class="nav">
        <a href="index.html">Home</a>
        <a href="classes.html">Classes</a>
        <a href="about.html">About</a>
        <a href="pricing.html">Pricing</a>
        <a id="loginNavLink" href="login.html">Login</a>
        <span id="userStatus" style="display:none; font-weight:700; margin-left:8px;"></span>
        <button id="logoutBtn" onclick="logout()" class="btn btn-dark" style="display:none; margin-left:8px;">Logout</button>
      </nav>
    </div>
  </header>

  <main class="booking-container">
    <div class="booking-card">

      <h1 class="payment-title">Membership Payment</h1>
      <p class="payment-subtitle">Complete your purchase</p>

      <div class="payment-section">
        <h3 class="payment-heading">Selected Plan</h3>
        <p><strong>Plan:</strong> <span id="planName"></span></p>
        <p><strong>Price:</strong> <span id="planPrice"></span></p>
      </div>

      <div class="payment-section">
        <h3 class="payment-heading">Payment Information</h3>

        <label for="card">Card Number *</label>
        <input id="card" maxlength="19" placeholder="1234 5678 9012 3456" required />

        <label for="name">Cardholder Name *</label>
        <input id="name" placeholder="John Doe" required />

        <label for="expiry">Expiry Date *</label>
        <input id="expiry" maxlength="5" placeholder="MM/YY" required />

        <label for="cvv">CVV *</label>
        <input id="cvv" maxlength="4" placeholder="123" required />

        <div class="billing-checkbox-row">
          <label for="useProfileAddress" class="billing-checkbox-label">
            <input type="checkbox" id="useProfileAddress" />
            <span>Use my registration address</span>
          </label>
        </div>

        <label for="street">Street *</label>
        <input id="street" placeholder="123 Main St" required />

        <label for="city">City *</label>
        <input id="city" placeholder="Orlando" required />

        <label for="state">State *</label>
        <input id="state" maxlength="2" placeholder="FL" required />

        <label for="zip">ZIP Code *</label>
        <input id="zip" maxlength="5" placeholder="12345" required />

        <p class="payment-note">Demo payment only. No real charge.</p>
      </div>

      <div class="payment-actions">
        <button class="secondary-btn" type="button" onclick="window.location.href='pricing.html'">
          Back
        </button>

        <button id="payBtn" class="primary-btn" type="button">
          Complete Payment
        </button>
      </div>

    </div>
  </main>

  <footer class="footer">
    <div class="container">
      <p>© <span id="year"></span> Uplift Gym</p>
    </div>
  </footer>

  <script>
    document.getElementById("year").textContent = new Date().getFullYear();

    const plan = JSON.parse(localStorage.getItem("selectedPlan"));
    const loggedInUser = JSON.parse(localStorage.getItem("loggedInUser") || "null");

    if (!plan) {
      window.location.href = "pricing.html";
    }

    document.getElementById("planName").textContent = plan.name;
    document.getElementById("planPrice").textContent = plan.price;

    const useProfileAddress = document.getElementById("useProfileAddress");

    const streetInput = document.getElementById("street");
    const cityInput = document.getElementById("city");
    const stateInput = document.getElementById("state");
    const zipInput = document.getElementById("zip");

    function clearErrors() {
      const fields = ["card", "name", "expiry", "cvv", "street", "city", "state", "zip"];
      fields.forEach((id) => {
        document.getElementById(id).classList.remove("input-error");
      });
    }

    function validatePayment() {
      clearErrors();
      let valid = true;

      const fields = ["card", "name", "expiry", "cvv", "street", "city", "state", "zip"];

      fields.forEach((id) => {
        const input = document.getElementById(id);

        if (input.disabled) {
          return;
        }

        if (!input.value.trim()) {
          input.classList.add("input-error");
          valid = false;
        }
      });

      const card = document.getElementById("card").value.replace(/\s/g, "");
      const expiry = document.getElementById("expiry").value.trim();
      const cvv = document.getElementById("cvv").value.trim();
      const state = document.getElementById("state").value.trim();
      const zip = document.getElementById("zip").value.trim();

      if (card && card.length !== 16) {
        document.getElementById("card").classList.add("input-error");
        valid = false;
      }

      if (expiry && !/^(0[1-9]|1[0-2])\/\d{2}$/.test(expiry)) {
        document.getElementById("expiry").classList.add("input-error");
        valid = false;
      }

      if (cvv && !/^\d{3,4}$/.test(cvv)) {
        document.getElementById("cvv").classList.add("input-error");
        valid = false;
      }

      if (state && state.length !== 2) {
        document.getElementById("state").classList.add("input-error");
        valid = false;
      }

      if (zip && !/^\d{5}$/.test(zip)) {
        document.getElementById("zip").classList.add("input-error");
        valid = false;
      }

      return valid;
    }

    useProfileAddress.addEventListener("change", function () {
      if (this.checked && loggedInUser) {
        streetInput.value = loggedInUser.street || "";
        cityInput.value = loggedInUser.city || "";
        stateInput.value = loggedInUser.state || "";
        zipInput.value = loggedInUser.zip || "";

        streetInput.disabled = true;
        cityInput.disabled = true;
        stateInput.disabled = true;
        zipInput.disabled = true;

        streetInput.classList.remove("input-error");
        cityInput.classList.remove("input-error");
        stateInput.classList.remove("input-error");
        zipInput.classList.remove("input-error");
      } else {
        streetInput.value = "";
        cityInput.value = "";
        stateInput.value = "";
        zipInput.value = "";

        streetInput.disabled = false;
        cityInput.disabled = false;
        stateInput.disabled = false;
        zipInput.disabled = false;
      }
    });

    document.getElementById("card").addEventListener("input", function (e) {
      let value = e.target.value.replace(/\D/g, "").substring(0, 16);
      value = value.replace(/(.{4})/g, "$1 ").trim();
      e.target.value = value;
    });

    document.getElementById("expiry").addEventListener("input", function (e) {
      let value = e.target.value.replace(/\D/g, "").substring(0, 4);

      if (value.length >= 3) {
        value = value.substring(0, 2) + "/" + value.substring(2);
      }

      e.target.value = value;
    });

    document.getElementById("cvv").addEventListener("input", function (e) {
      e.target.value = e.target.value.replace(/\D/g, "").substring(0, 4);
    });

    document.getElementById("state").addEventListener("input", function (e) {
      e.target.value = e.target.value.replace(/[^a-zA-Z]/g, "").substring(0, 2).toUpperCase();
    });

    document.getElementById("zip").addEventListener("input", function (e) {
      e.target.value = e.target.value.replace(/\D/g, "").substring(0, 5);
    });

    document.getElementById("payBtn").addEventListener("click", () => {
      if (!validatePayment()) {
        return;
      }

      if (plan.key !== "single-class") {
        localStorage.setItem("membershipActive", "true");
      }

      window.location.href = "confirm.html";
    });
  </script>

  <script src="auth.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      renderAuthMenu();
    });
  </script>
<script src="auth.js"></script>
<script>
  requireAuth();
</script>
</body>
</html>
