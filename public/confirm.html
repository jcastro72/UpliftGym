<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Confirmation - Uplift Gym</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- HEADER -->
  <header class="header">
    <div class="container header-inner">
      <a class="brand" href="index.html">
        <img src="images/uplift.png" alt="Uplift Gym logo" class="brand-logo" />
        <span class="brand-name">Uplift Gym</span>
      </a>

      <nav class="nav">
        <a href="index.html">Home</a>
        <a href="classes.html">Classes</a>
        <a href="about.html">About</a>
        <a href="pricing.html">Pricing</a>
      </nav>
    </div>
  </header>

  <!-- CONFIRM -->
  <main class="section">
    <div class="container">
      <div class="section-head" style="text-align:center;">
        <h2>You're all set!</h2>
        <p>Plan selection confirmed. Next step: book your class.</p>
      </div>

      <div class="confirm-card">
        <p class="confirm-pill">Confirmation</p>

        <h3 id="planTitle" class="confirm-title">Selected Plan</h3>
        <p id="planDesc" class="confirm-sub"></p>

        <div class="confirm-actions">
          <a class="btn btn-primary" href="classes.html">Book a Class</a>
          <a class="btn btn-outline-dark" href="pricing.html">Back to Pricing</a>
        </div>

        <p class="confirm-note">
          Demo note: This is a front-end confirmation screen for the Capstone prototype (no payment processed).
        </p>
      </div>
    </div>
  </main>

  <!-- FOOTER -->
  <footer class="footer">
    <div class="container">
      <p>© <span id="year"></span> Uplift Gym</p>
    </div>
  </footer>

  <script>
    document.getElementById("year").textContent = new Date().getFullYear();

    const plans = {
      single: {
        title: "Single Class ($25)",
        desc: "One-time class booking with live availability tracking."
      },
      starter: {
        title: "Starter ($79/month)",
        desc: "2 classes per week with real-time booking."
      },
      plus: {
        title: "Plus ($119/month)",
        desc: "4 classes per week with priority booking and basic member perks."
      },
      unlimited: {
        title: "Unlimited ($159/month)",
        desc: "Unlimited access with priority booking and exclusive member perks."
      }
    };

    const params = new URLSearchParams(window.location.search);
    const planKey = params.get("plan") || "starter";
    const selected = plans[planKey] || plans.starter;

    document.getElementById("planTitle").textContent = selected.title;
    document.getElementById("planDesc").textContent = selected.desc;
  </script>

</body>
</html>
