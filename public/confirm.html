<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Confirmation - Uplift Gym</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- HEADER -->
  <header class="header">
    <div class="container header-inner">
      <a class="brand" href="index.html">
        <img src="images/uplift.png" alt="Uplift Gym logo" class="brand-logo" />
        <span class="brand-name">Uplift Gym</span>
      </a>

      <nav class="nav">
        <a href="index.html">Home</a>
        <a href="classes.html">Classes</a>
        <a href="about.html">About</a>
        <a href="pricing.html">Pricing</a>
      </nav>
    </div>
  </header>

  <!-- CONFIRM -->
  <main class="section">
    <div class="container">
      <div class="section-head" style="text-align:center;">
        <h2>Plan Selected</h2>
        <p>Your membership plan has been selected successfully.</p>
      </div>

      <div class="confirm-card">
        <p class="confirm-pill">Confirmation</p>

        <h3 id="planTitle" class="confirm-title">Selected Plan</h3>
        <p id="planDesc" class="confirm-sub"></p>

        <div class="confirm-actions">
          <a class="btn btn-primary" href="classes.html">Book a Class</a>
          <a class="btn btn-outline-dark" href="pricing.html">Back to Pricing</a>
        </div>

        <p class="confirm-note">
          Demo note: This is a front-end confirmation screen for the Capstone prototype (no payment processed).
        </p>
      </div>
    </div>
  </main>

  <!-- FOOTER -->
  <footer class="footer">
    <div class="container">
      <p>© <span id="year"></span> Uplift Gym</p>
    </div>
  </footer>

  <script>
  document.getElementById("year").textContent = new Date().getFullYear();

  const plans = {
    starter: {
      title: "Starter Plan ($79/month)",
      desc: "Includes 2 classes per week with real-time booking and access to available classes.",
      buttonText: "Book Classes",
      buttonHref: "classes.html"
    },
    plus: {
      title: "Plus Plan ($119/month)",
      desc: "Includes 4 classes per week with real-time booking and more weekly flexibility.",
      buttonText: "Book Classes",
      buttonHref: "classes.html"
    },
    unlimited: {
      title: "Unlimited Plan ($159/month)",
      desc: "Includes unlimited classes with real-time booking and access to available classes.",
      buttonText: "Book Classes",
      buttonHref: "classes.html"
    }
  };

  const params = new URLSearchParams(window.location.search);
  const planKey = params.get("plan") || "starter";
  const selected = plans[planKey] || plans.starter;

  document.getElementById("planTitle").textContent = selected.title;
  document.getElementById("planDesc").textContent = selected.desc;

  const nextActionBtn = document.getElementById("nextActionBtn");
  nextActionBtn.textContent = selected.buttonText;
  nextActionBtn.href = selected.buttonHref;
</script>

</body>
</html>
