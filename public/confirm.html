<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Confirmation - Uplift Gym</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <header class="header">
    <div class="container header-inner">
      <a class="brand" href="index.html">
        <img src="images/uplift.png" alt="Uplift Gym logo" class="brand-logo" />
        <span class="brand-name">Uplift Gym</span>
      </a>

      <nav class="nav">
        <a href="index.html">Home</a>
        <a href="classes.html">Classes</a>
        <a href="about.html">About</a>
        <a href="pricing.html">Pricing</a>
         <a id="loginNavLink" href="login.html">Login</a>
        <span id="userStatus" style="display:none; font-weight:700; margin-left:8px;"></span>
        <button id="logoutBtn" onclick="logout()" class="btn btn-dark" style="display:none; margin-left:8px;">Logout</button>
      </nav>
    </div>
  </header>

  <main class="section">
    <div class="container">
      <div class="section-head" style="text-align:center;">
        <h2>Payment Successful</h2>
        <p>Your purchase has been completed successfully.</p>
      </div>

      <div class="confirm-card">
        <p class="confirm-pill">Confirmation</p>

        <h3 id="planTitle" class="confirm-title"></h3>
        <p id="planDesc" class="confirm-sub"></p>

        <div class="confirm-actions">
          <a class="btn btn-primary" href="classes.html">Book a Class</a>
          <a class="btn btn-outline-dark" href="pricing.html">Back to Pricing</a>
        </div>

        <p class="confirm-note">
          This is a demo confirmation. No real payment was processed.
        </p>
      </div>
    </div>
  </main>

  <footer class="footer">
    <div class="container">
      <p>© <span id="year"></span> Uplift Gym</p>
    </div>
  </footer>

  <script>
  document.getElementById("year").textContent = new Date().getFullYear();

  const plan = JSON.parse(localStorage.getItem("selectedPlan"));

  if (!plan) {
    document.getElementById("planTitle").textContent = "No plan selected";
  } else {
    document.getElementById("planTitle").textContent = plan.name;
    document.getElementById("planDesc").textContent =
      `${plan.price} • ${plan.description}`;
  }
  </script>

  <script src="auth.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      renderAuthMenu();
    });
  </script>
  <script src="auth.js"></script>
<script>
  requireAuth();
</script>

</body>
</html>
