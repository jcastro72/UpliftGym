<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Profile - Uplift Gym</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="auth.js"></script>
    <style>
        .profile-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 28px;
            align-items: start;
        }

        @media (max-width: 768px) {
            .profile-grid {
                grid-template-columns: 1fr;
            }
        }

        .membership-badge {
            display: inline-block;
            padding: 6px 14px;
            border-radius: 999px;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0.3px;
        }

        .membership-badge.active {
            background: #dcfce7;
            color: #15803d;
        }

        .membership-badge.inactive {
            background: #fee2e2;
            color: #b91c1c;
        }

        .booking-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            margin-bottom: 10px;
            gap: 12px;
            flex-wrap: wrap;
        }

        .booking-item .booking-info strong {
            display: block;
            font-size: 15px;
        }

        .booking-item .booking-info span {
            font-size: 13px;
            color: var(--muted);
        }

        .booking-item .booking-date {
            font-size: 13px;
            font-weight: 600;
            color: var(--primary);
            white-space: nowrap;
        }

        .profile-msg {
            margin-top: 12px;
            font-size: 14px;
            font-weight: 600;
        }

        .profile-msg.success {
            color: #15803d;
        }

        .profile-msg.error {
            color: #b91c1c;
        }
    </style>
</head>

<body>

    <script>
        document.addEventListener("DOMContentLoaded", async () => {
            await requireAuth();
        });
    </script>

    <!-- HEADER -->
    <header class="header">
        <div class="container header-inner">
            <a class="brand" href="index.html">
                <img src="images/uplift.png" alt="Uplift Gym logo" class="brand-logo" />
                <span class="brand-name">Uplift Gym</span>
            </a>
            <nav class="nav">
                <a href="index.html">Home</a>
                <a href="classes.html">Classes</a>
                <a href="about.html">About</a>
                <a href="pricing.html">Pricing</a>
                <a id="loginNavLink" href="login.html">Login</a>
                <span id="userStatus" style="display:none; font-weight:700;"></span>
                <button id="logoutBtn" onclick="logout()" class="btn btn-dark" style="display:none;">Logout</button>
            </nav>
        </div>
    </header>

    <main class="section">
        <div class="container">

            <div class="section-head" style="text-align:center; margin-bottom: 32px;">
                <h2>My Profile</h2>
                <p>View and update your account details.</p>
            </div>

            <div class="profile-grid">

                <!-- LEFT: Edit Profile Form -->
                <div class="confirm-card">
                    <h3 style="margin-bottom: 18px; font-size: 18px;">Account Details</h3>

                    <!-- Membership status summary -->
                    <div
                        style="margin-bottom: 20px; padding: 14px 16px; background: var(--bg); border: 1px solid var(--border); border-radius: 10px;">
                        <p style="font-size: 13px; color: var(--muted); margin-bottom: 6px;">Membership</p>
                        <span id="membershipBadge" class="membership-badge inactive">Inactive</span>
                        <span id="membershipPlan"
                            style="font-size: 13px; color: var(--muted); margin-left: 10px;"></span>
                    </div>

                    <form id="profileForm">
                        <div class="form-section">
                            <label for="firstName"><strong>First Name</strong></label>
                            <input type="text" id="firstName" placeholder="First name" required />

                            <label for="lastName"><strong>Last Name</strong></label>
                            <input type="text" id="lastName" placeholder="Last name" required />

                            <label for="email"><strong>Email</strong></label>
                            <input type="email" id="email" placeholder="you@example.com" disabled
                                style="opacity:0.65; cursor:not-allowed;" />

                            <label for="phone"><strong>Phone</strong></label>
                            <input type="tel" id="phone" placeholder="(555) 000-0000" />

                            <label for="dob"><strong>Date of Birth</strong></label>
                            <input type="date" id="dob" />

                            <label for="street"><strong>Street</strong></label>
                            <input type="text" id="street" placeholder="123 Main St" />

                            <label for="city"><strong>City</strong></label>
                            <input type="text" id="city" placeholder="Orlando" />

                            <label for="state"><strong>State</strong></label>
                            <input type="text" id="state" maxlength="2" placeholder="FL" />

                            <label for="zip"><strong>ZIP Code</strong></label>
                            <input type="text" id="zip" maxlength="5" placeholder="12345" />
                        </div>

                        <button type="submit" class="btn btn-primary" style="width:100%;">Save Changes</button>
                    </form>

                    <p id="profileMsg" class="profile-msg" style="display:none;"></p>
                </div>

                <!-- RIGHT: My Bookings -->
                <div class="confirm-card">
                    <h3 style="margin-bottom: 18px; font-size: 18px;">My Bookings</h3>
                    <div id="bookingsList">
                        <p style="color: var(--muted); font-size: 14px;">Loading your bookings…</p>
                    </div>
                </div>

            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <p>© <span id="year"></span> Uplift Gym</p>
        </div>
    </footer>

    <script>
        document.getElementById("year").textContent = new Date().getFullYear();
    </script>
    <script src="profile.js"></script>

</body>

</html>
